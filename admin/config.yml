backend:
  name: github
  repo: oslemoncat/oslemoncat.github.io
  branch: main
  # Replace with your deployed authentication Worker origin (no trailing slash).
  base_url: https://lemoncat-cms-auth.zhounanxuan071106.workers.dev
  auth_endpoint: auth

locale: zh_Hans
site_url: https://oslemoncat.github.io
display_url: https://oslemoncat.github.io
publish_mode: editorial_workflow
show_preview_links: false
media_folder: assets/images/uploads
public_folder: /assets/images/uploads
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: posts
    label: 学习文章
    label_singular: 文章
    folder: content/posts
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: '{{fields.slug}}'
    identifier_field: slug
    summary: '{{title}} · {{module}}'
    editor:
      preview: false
    fields:
      - label: 文章地址
        name: slug
        widget: string
        hint: 使用小写英文、数字和短横线；发布后请保持不变。
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '例如 sequence-limits']
      - { label: 主标题, name: title, widget: string }
      - { label: 副标题, name: subtitle, widget: string, required: false, hint: '选填，最多 160 字，与摘要分别保存。' }
      - { label: 摘要, name: summary, widget: text, required: false }
      - label: 知识模块
        name: module
        widget: select
        # cms-build.mjs synchronizes these options from content/modules.json.
        options:
          - { label: 数学分析, value: math-analysis }
          - { label: C与C++, value: programming }
          - { label: python, value: python }
          - { label: C#, value: csharp }
          - { label: 杂记, value: misc }
          - { label: 论坛, value: forum }
          - { label: 线性代数, value: linear-algebra }
      - { label: 首次发布日期, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: 更新日期, name: updated, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: 标签, name: tags, widget: list, required: false }
      - label: 封面图
        name: cover
        widget: image
        required: false
        hint: 点击“选择图片”后上传，单张图片不超过 10 MB。
        media_library:
          allow_multiple: false
          config: { max_file_size: 10485760 }
      - { label: 同日排序权重, name: order, widget: number, value_type: int, default: 0, required: false }
      - label: 暂时隐藏文章
        name: draft
        widget: boolean
        default: false
        hint: 开启后即使合并到 main，文章也不会出现在发布的网站中。正常草稿请使用“保存草稿”。
      - label: 正文
        name: body
        widget: markdown
        hint: '公式与 ::: 定理/视频块请使用 Markdown 源码模式编辑；语法沿用现有网站。'
      - label: 文章图片
        name: images
        widget: list
        label_singular: 图片
        required: false
        default: []
        collapsed: true
        summary: '{{fields.caption}} · {{fields.src}}'
        hint: 添加图片后，发布的文章正文下方会显示图片；正文中插图也可以使用编辑器工具栏。
        fields:
          - label: 图片文件
            name: src
            widget: image
            media_library:
              allow_multiple: false
              config: { max_file_size: 10485760 }
            hint: 支持 JPG、PNG、WebP、GIF 等图片，单张不超过 10 MB。
          - { label: 图片说明, name: caption, widget: string, required: false }
      - label: 附件与音视频
        name: attachments
        widget: list
        label_singular: 附件
        required: false
        default: []
        collapsed: true
        summary: '{{fields.title}} · {{fields.file}}'
        hint: 支持 PDF、Word、Excel、PPT、TXT、ZIP，以及音视频文件。单个文件不超过 20 MB，发布后会显示下载入口。
        fields:
          - { label: 显示名称, name: title, widget: string, required: false, hint: 不填写时显示文件名。 }
          - label: 文件
            name: file
            widget: file
            media_folder: /assets/files/uploads
            public_folder: /assets/files/uploads
            media_library:
              allow_multiple: false
              config: { max_file_size: 20971520 }
            hint: 点击“选择文件”后上传，也可以填写已有文件的网址。

  - name: settings
    label: 网站设置
    files:
      - name: site
        label: 基本信息与导航
        file: content/site.json
        fields:
          - { label: 网站标题, name: title, widget: string }
          - { label: 简称, name: shortTitle, widget: string }
          - { label: 描述, name: description, widget: text }
          - { label: 作者, name: author, widget: string }
          - { label: 语言, name: lang, widget: hidden, default: zh-CN }
          - { label: 网站地址, name: url, widget: string }
          - label: 导航
            name: nav
            widget: list
            fields:
              - { label: 名称, name: label, widget: string }
              - { label: 链接, name: href, widget: string }
          - label: 页脚
            name: footer
            widget: object
            fields:
              - { label: 说明, name: note, widget: string }
              - { label: 备案, name: icp, widget: string, required: false }
